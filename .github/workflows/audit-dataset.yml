name: Independent Dataset v0.2 Audit
# Re-runs after every audit-tool change; report is uploaded as a workflow artifact.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-dataset.yml"
      - "tools/audit_dataset.py"
      - "kandoo-intent-dataset_v0.2.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Audit delivered ZIP
        run: |
          python tools/audit_dataset.py \
            --archive kandoo-intent-dataset_v0.2.zip \
            --out audit-output

      - name: Upload independent audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kandoo-dataset-v0.2-independent-audit
          path: |
            audit-output/audit-report.md
            audit-output/audit-report.json
          if-no-files-found: warn
